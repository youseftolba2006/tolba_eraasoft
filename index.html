<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/style.css">

</head>

<body>
    <section class="main-section">
        <div class="add-window">
            <div class="add-window-up"> <span> Add New Task </span>
                <p> Add new task in todo list name and description</p>
            </div>
            <div class="add-window-down">
                <div class="px-4 py-4 w-100">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control shadow-sm" id="taskName" placeholder="Task Name">
                        <label for="taskName">Task Name</label>
                    </div>
                    <div class="form-floating mb-4">
                        <input type="text" class="form-control shadow-sm" id="taskDescription"
                            placeholder="Task Description">
                        <label for="taskDescription">Task Description</label>
                    </div>
                    <button class="btn btn-primary btn-lg w-100 shadow-sm fw-bold button" id="addTask">Add
                        Task</button>
                </div>
            </div>
        </div>

        <div class="task-window">
            <div class="filters">
                <span class=" fw-bold">Your Tasks</span>

                <div class="glass-radio-group">
                    <input type="radio" name="plan" id="glass-silver" checked="" />
                    <label for="glass-silver" id="all_Tasks">ALL</label>

                    <input type="radio" name="plan" id="glass-gold"  />
                    <label for="glass-gold" id="completed_Tasks">COMPELETED TASKS</label>

                    <input type="radio" name="plan" id="glass-platinum" />
                    <label for="glass-platinum" id="pending_Tasks">PENDING TASKS</label>

                    <div class="glass-glider"></div>
                </div>

            </div>
            <div class="cards">
            </div>

            <div class="text-warning text-center fw-bold warning-statue"> if u want to edit any task statue click ON IT </div>
    </section>

    

    <script src="./js/script.js"></script>
</body>

</html>
